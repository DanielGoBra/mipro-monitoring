<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Estado de servicios · Inklusiva</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='3' fill='%23f4efe6'/%3E%3Cpath fill='%230e1c33' d='M7 25V8h4l5 8 5-8h4v17h-4V14l-5 8-5-8v11H7z'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,550;6..72,600&family=Public+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/static/tokens.css">
<style>
*{box-sizing:border-box}
body{margin:0;font-family:var(--font-sans);background:var(--ivory);color:var(--navy);-webkit-font-smoothing:antialiased}
.wrap{max-width:820px;margin:0 auto;padding:36px 18px 72px}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:22px}
.brand{display:flex;align-items:center;gap:12px}
.brand h1{font-family:var(--font-serif);font-size:28px;font-weight:550;margin:0;letter-spacing:-.03em}
.brand p{margin:2px 0 0;color:var(--muted-ink);font-size:13px}
.updated{color:var(--muted-ink);font-size:12px}
.banner{border-radius:4px;padding:18px 20px;font-family:var(--font-serif);font-weight:550;font-size:22px;letter-spacing:-.02em;display:flex;gap:12px;align-items:center;margin-bottom:26px}
.banner.ok{background:var(--navy);color:var(--ivory)}
.banner.warn{background:var(--warn-bg);color:var(--navy)}
.banner.bad{background:var(--fail-wash);color:var(--navy)}
.dot{width:8px;height:8px;border-radius:1px;background:var(--ivory);flex:none}
.banner.warn .dot,.banner.bad .dot{background:var(--navy)}
h2{font-size:11px;text-transform:uppercase;letter-spacing:.12em;color:var(--muted-ink);margin:28px 0 10px}
.svc{background:var(--paper);border:1px solid var(--paper-line);border-radius:4px;padding:14px 16px;margin-bottom:8px}
.svc-top{display:flex;justify-content:space-between;align-items:center;gap:12px}
.svc b{font-size:15px}
.ms{color:var(--muted-ink);font-size:12px;margin-top:2px}
.pill{font-size:12px;font-weight:600;padding:4px 8px;border-radius:2px}
.pill.ok{background:var(--navy);color:var(--ivory)}
.pill.bad{background:var(--fail-wash);color:var(--brick)}
.bars{display:flex;gap:2px;height:28px;margin-top:12px}
.bars i{flex:1 1 0;border-radius:1px;background:var(--paper-line);display:block}
.bars i.g{background:var(--pine)}
.bars i.r{background:var(--brick)}
.upline{display:flex;justify-content:space-between;color:var(--muted-ink);font-size:12px;margin-top:6px}
.inc{background:var(--paper);border:1px solid var(--paper-line);border-left:4px solid var(--warn);border-radius:4px;padding:12px 16px;margin-bottom:8px;font-size:13px}
.inc.bad{border-left-color:var(--brick)}
.inc small{color:var(--muted-ink)}
.empty{color:var(--muted-ink);font-size:14px;background:var(--paper);border:1px dashed var(--paper-line);border-radius:4px;padding:16px}
footer{margin-top:36px;color:#8b97a6;font-size:12px;text-align:center}
@media(max-width:640px){.svc-top{align-items:flex-start;flex-direction:column}.banner{font-size:16px}}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <div class="brand">
      <svg width="36" height="36" viewBox="0 0 32 32" aria-hidden="true"><rect width="32" height="32" rx="3" fill="#0e1c33"/><path fill="#f4efe6" d="M7 25V8h4l5 8 5-8h4v17h-4V14l-5 8-5-8v11H7z"/></svg>
      <div><h1>Estado de servicios</h1><p>Inklusiva · T.I</p></div>
    </div>
    <div class="updated" id="updated">Actualizando…</div>
  </div>
  <div class="banner ok" id="banner"><span class="dot"></span><span id="bannerTxt">Cargando…</span></div>
  <h2>Servicios</h2>
  <div id="svcs"></div>
  <h2>Incidentes abiertos</h2>
  <div id="incs"></div>
  <footer>MiPro Monitoring · página pública, sin datos de red interna</footer>
</div>
<script>
function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(m){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m];});}
async function historyOf(name){
  try{
    const h=await (await fetch("/api/history?name="+encodeURIComponent(name)+"&hours=72")).json();
    return Array.isArray(h)?h.slice(-72):[];
  }catch(e){return [];}
}
async function load(){
  try{
    const r=await (await fetch("/api/public-status")).json();
    const sv=r.services||[];
    const down=sv.filter(function(s){return !s.ok;});
    const b=document.getElementById("banner");
    b.className="banner "+(down.length?(down.length<sv.length?"warn":"bad"):"ok");
    document.getElementById("bannerTxt").textContent=down.length?("Incidente: "+down.map(function(s){return s.name;}).join(", ")):(sv.length?"Todos los sistemas operativos":"Sin servicios publicados");
    document.getElementById("updated").textContent="Actualizado "+new Date().toLocaleTimeString();
    const enriched=await Promise.all(sv.map(async function(s){s._h=await historyOf(s.name);return s;}));
    document.getElementById("svcs").innerHTML=enriched.map(function(s){
      const last=s._h||[];
      const okN=last.filter(function(x){return x.ok;}).length;
      const pct=last.length?Math.round(okN/last.length*100):null;
      const bars=last.length?last.map(function(x){return '<i class="'+(x.ok?"g":"r")+'" title="'+esc(new Date(x.ts*1000).toLocaleString())+'"></i>';}).join(""):"";
      return '<article class="svc"><div class="svc-top"><div><b>'+esc(s.name)+'</b><div class="ms">'+(s.latency_ms==null?"—":esc(s.latency_ms)+" ms")+'</div></div><span class="pill '+(s.ok?"ok":"bad")+'">'+(s.ok?"Operativo":"Caído")+'</span></div>'+(bars?'<div class="bars">'+bars+'</div><div class="upline"><span>72 h</span><span>'+pct+"% uptime</span></div>":"")+"</article>";
    }).join("")||'<div class="empty">Sin datos publicados.</div>';
    const incs=(r.incidents||[]);
    document.getElementById("incs").innerHTML=incs.length?incs.map(function(i){
      return '<div class="inc '+(i.level==="CRITICO"?"bad":"")+'"><b>'+esc(i.title)+'</b><br><small>'+esc(i.status)+" · "+esc(new Date(i.ts_start*1000).toLocaleString())+"</small></div>";
    }).join(""):'<div class="empty">Sin incidentes abiertos.</div>';
  }catch(e){
    document.getElementById("banner").className="banner bad";
    document.getElementById("bannerTxt").textContent="No se pudo cargar el estado";
  }
}
load();
setInterval(load,30000);
</script>
</body>
</html>
